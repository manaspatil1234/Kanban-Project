<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="kanbanscript.css">
</head>
<body>
    <main>
    <nav>
        <div class="left">Kanban</div>
        <div class="right"><button id="toggle-modal">Add New Task</button></div>

    </nav>
    
    <section class="Board">
        <div id="todo"  class="Task-column">
            <div class="heading">
                <div class="left">To Do</div>
                <div class="right">Count</div>
            </div>
            
        
        </div>
    
        <div id="progress" class="Task-column" >
            <div class="heading">
                <div class="left">In Progress</div>
                <div class="right">Count</div>
            </div>
            
        </div>
        
        <div id="done"  class="Task-column">
            <div class="heading">
                <div class="left">Done</div>
            <div class="right">Count</div>
            </div>
            
        </div>
        
    
    </section>
    
    </main>
       
        <div class="modal  add-new-task">
            <div class="bg"></div>
            <div class="center">
                <input id="task-title-input"  type="text" placeholder="Task Title">
                <textarea id="task-desc-input"  placeholder="task description"></textarea>
                <button  id="add-task-btn"   class="add-class-btn">Add Task</button>
            </div>
            
    </div>
    <script src="kanban.js"></script>
</body>
</html>
